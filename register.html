<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | HomeMart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"></head><body data-page="register"><div id="site-header"></div><main class="auth"><form class="auth-card" id="register-form"><p class="eyebrow">Join our community</p><h1>Create your account</h1><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel" pattern="[0-9]{10}" required placeholder="10-digit mobile number"></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Confirm password<input name="confirmPassword" type="password" minlength="6" required></label><button class="btn">Create Account</button><p class="form-note">Already have an account? <a href="login.html">Sign in</a></p></form></main><div id="site-footer"></div><div id="toast"></div><script src="products.js"></script><script src="script.js"></script></body></html>
